<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_58 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_58" style="display:block;"><svg height="100%" viewbox="0 0 500 500" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialgradient cx="50%" cy="60%" id="flameCoreGlow" r="50%">
<stop offset="0%" stop-color="#fef08a" stop-opacity="1"></stop>
<stop offset="25%" stop-color="#f59e0b" stop-opacity="0.9"></stop>
<stop offset="55%" stop-color="#f97316" stop-opacity="0.75"></stop>
<stop offset="85%" stop-color="#ef4444" stop-opacity="0.3"></stop>
<stop offset="100%" stop-color="#060e20" stop-opacity="0"></stop>
</radialgradient>
<lineargradient id="fireGradOuter" x1="50%" x2="50%" y1="100%" y2="0%">
<stop offset="0%" stop-color="#b91c1c"></stop>
<stop offset="30%" stop-color="#ea580c"></stop>
<stop offset="70%" stop-color="#f59e0b"></stop>
<stop offset="100%" stop-color="#fef08a"></stop>
</lineargradient>
<lineargradient id="fireGradInner" x1="50%" x2="50%" y1="100%" y2="0%">
<stop offset="0%" stop-color="#ea580c"></stop>
<stop offset="40%" stop-color="#f59e0b"></stop>
<stop offset="85%" stop-color="#fef08a"></stop>
<stop offset="100%" stop-color="#ffffff"></stop>
</lineargradient>
<lineargradient id="cyanArcaneGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#38bdf8"></stop>
<stop offset="100%" stop-color="#0284c7"></stop>
</lineargradient>
<filter height="200%" id="flameBloom" width="200%" x="-50%" y="-50%">
<fegaussianblur result="blur1" stddeviation="8"></fegaussianblur>
<fegaussianblur result="blur2" stddeviation="16"></fegaussianblur>
<femerge>
<femergenode in="blur2"></femergenode>
<femergenode in="blur1"></femergenode>
<femergenode in="SourceGraphic"></femergenode>
</femerge>
</filter>
<filter height="160%" id="ringGlow" width="160%" x="-30%" y="-30%">
<fedropshadow dx="0" dy="0" flood-color="#f59e0b" flood-opacity="0.6" stddeviation="6"></fedropshadow>
</filter>
</defs>
<style>
    @keyframes pulseRing {
      0% { transform: scale(0.96) rotate(0deg); opacity: 0.7; }
      50% { transform: scale(1.03) rotate(180deg); opacity: 1; filter: drop-shadow(0 0 16px rgba(245, 158, 11, 0.8)); }
      100% { transform: scale(0.96) rotate(360deg); opacity: 0.7; }
    }
    @keyframes flameFlickerA {
      0% { transform: scale(1) translate(0, 0) skewX(0deg); }
      25% { transform: scale(1.02, 0.98) translate(-2px, -3px) skewX(-1.5deg); }
      50% { transform: scale(0.98, 1.03) translate(2px, -5px) skewX(1.5deg); }
      75% { transform: scale(1.01, 0.99) translate(-1px, -2px) skewX(-1deg); }
      100% { transform: scale(1) translate(0, 0) skewX(0deg); }
    }
    @keyframes flameFlickerB {
      0% { transform: scale(1) translate(0, 0) scaleX(1); opacity: 0.95; }
      33% { transform: scale(0.96, 1.04) translate(3px, -4px) scaleX(0.98); opacity: 1; }
      66% { transform: scale(1.03, 0.97) translate(-3px, -2px) scaleX(1.02); opacity: 0.85; }
      100% { transform: scale(1) translate(0, 0) scaleX(1); opacity: 0.95; }
    }
    @keyframes sparkRise1 {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      30% { opacity: 1; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-130px) scale(0.2); opacity: 0; }
    }
    @keyframes sparkRise2 {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      20% { opacity: 1; }
      75% { opacity: 0.7; }
      100% { transform: translateY(-160px) translateX(25px) scale(0.3); opacity: 0; }
    }
    @keyframes sparkRise3 {
      0% { transform: translateY(0) scale(0.7); opacity: 0; }
      25% { opacity: 1; }
      70% { opacity: 0.9; }
      100% { transform: translateY(-145px) translateX(-20px) scale(0.1); opacity: 0; }
    }
    @keyframes runicRotateReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes coreRadiance {
      0%, 100% { r: 110px; opacity: 0.6; }
      50% { r: 135px; opacity: 0.9; }
    }

    .anim-ring { transform-origin: 250px 250px; animation: pulseRing 12s linear infinite; }
    .anim-rune-ring { transform-origin: 250px 250px; animation: runicRotateReverse 24s linear infinite; }
    .anim-flame-main { transform-origin: 250px 330px; animation: flameFlickerA 2.6s ease-in-out infinite; }
    .anim-flame-inner { transform-origin: 250px 330px; animation: flameFlickerB 1.8s ease-in-out infinite; }
    .spark-1 { animation: sparkRise1 2.2s cubic-bezier(0.2, 0.8, 0.3, 1) infinite; }
    .spark-2 { animation: sparkRise2 2.8s cubic-bezier(0.2, 0.8, 0.3, 1) infinite 0.6s; }
    .spark-3 { animation: sparkRise3 2.5s cubic-bezier(0.2, 0.8, 0.3, 1) infinite 1.1s; }
    .spark-4 { animation: sparkRise1 3s cubic-bezier(0.2, 0.8, 0.3, 1) infinite 1.7s; }
    .spark-5 { animation: sparkRise2 2.4s cubic-bezier(0.2, 0.8, 0.3, 1) infinite 1.3s; }
    .radial-pulse { animation: coreRadiance 3s ease-in-out infinite; }
  </style>
<!-- Ambient Glow Background -->
<circle class="radial-pulse" cx="250" cy="260" fill="url(#flameCoreGlow)" r="120"></circle>
<!-- Outer Cybernetic Runic Gear / Stasis Ring -->
<g class="anim-ring" filter="url(#ringGlow)">
<circle cx="250" cy="250" fill="none" r="190" stroke="#f59e0b" stroke-dasharray="8 6" stroke-opacity="0.25" stroke-width="1.5"></circle>
<circle cx="250" cy="250" fill="none" r="172" stroke="#38bdf8" stroke-dasharray="2 10" stroke-opacity="0.35" stroke-width="1"></circle>
<circle cx="250" cy="250" fill="none" r="154" stroke="#f59e0b" stroke-dasharray="45 15 15 15" stroke-opacity="0.4" stroke-width="2"></circle>
<!-- Reticle Ticks & Brackets -->
<path d="M250 50 L250 65 M250 435 L250 450 M50 250 L65 250 M435 250 L450 250" stroke="#f59e0b" stroke-linecap="round" stroke-width="3"></path>
<polygon fill="#fbbf24" points="250,56 254,64 246,64"></polygon>
<polygon fill="#fbbf24" points="250,444 254,436 246,436"></polygon>
<polygon fill="#38bdf8" points="56,250 64,246 64,254"></polygon>
<polygon fill="#38bdf8" points="444,250 436,246 436,254"></polygon>
</g>
<!-- Reverse Inner Rune Matrix -->
<g class="anim-rune-ring">
<circle cx="250" cy="250" fill="none" r="138" stroke="#f59e0b" stroke-dasharray="6 14" stroke-opacity="0.3" stroke-width="1"></circle>
<g fill="#f59e0b" font-family="'Outfit', monospace" font-size="8" font-weight="700" opacity="0.6">
<text text-anchor="middle" x="250" y="120">SYNAPSE-V24</text>
<text text-anchor="middle" x="380" y="253">SOLAR-STREAK</text>
<text text-anchor="middle" x="250" y="386">MOMENTUM-LOCK</text>
<text text-anchor="middle" x="120" y="253">DISCIPLINE</text>
</g>
</g>
<!-- Rising Ember Particles -->
<g filter="url(#flameBloom)">
<circle class="spark-1" cx="240" cy="300" fill="#fef08a" r="3.5"></circle>
<circle class="spark-2" cx="265" cy="315" fill="#f59e0b" r="4.5"></circle>
<circle class="spark-3" cx="230" cy="325" fill="#fbbf24" r="3"></circle>
<circle class="spark-4" cx="255" cy="290" fill="#ffffff" r="2.5"></circle>
<circle class="spark-5" cx="275" cy="335" fill="#f97316" r="3.5"></circle>
<circle class="spark-2" cx="220" cy="310" fill="#38bdf8" r="2"></circle>
<circle class="spark-3" cx="280" cy="305" fill="#38bdf8" r="2"></circle>
</g>
<!-- Layer 1: Outer Dark Flame Silhouette -->
<g class="anim-flame-main" filter="url(#flameBloom)">
<!-- Base Outer Flame Silhouette -->
<path d="M250 110
             C275 160 330 205 330 270
             C330 335 285 375 250 375
             C215 375 170 335 170 270
             C170 215 210 170 220 150
             C225 175 235 195 245 195
             C255 195 260 175 255 150
             Z" fill="url(#fireGradOuter)" opacity="0.95"></path>

             C270 190 305 230 305 280
             C305 335 270 365 250 365
             C230 365 195 335 195 280
             C195 240 220 205 235 180
             C238 200 244 215 252 215
             C260 215 262 195 255 170

             C280 340 260 355 250 355

<ellipse cx="250" cy="305" fill="#ffffff" filter="url(#flameBloom)" rx="18" ry="28"></ellipse>
</g>
<!-- Bottom Cyber Altar Base / Energy Clamp -->
<g transform="translate(190, 360)">
<path d="M0 15 L15 0 H105 L120 15 L110 22 H10 Z" fill="#131b2e" stroke="#f59e0b" stroke-width="1.5"></path>
<rect fill="#38bdf8" filter="url(#flameBloom)" height="4" rx="2" width="50" x="35" y="8"></rect>
<circle cx="60" cy="18" fill="#f59e0b" r="3"></circle>
</g>
</svg></div><!-- STITCH_SVG_END:ANIMATION_58 -->
</body>
</html>
