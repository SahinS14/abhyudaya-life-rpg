<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08070e">
  <meta name="description" content="Sign in to Abhyudaya LifeQuest.">
  <title>Enter Sanctuary — Abhyudaya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,600;1,600&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--gold:#d9a44b;--pale:#ffe9b3;--bg:#08070e;--line:rgba(223,168,74,.26);--copy:#b4b0bb}*{box-sizing:border-box}body{min-width:320px;margin:0;color:#f8eedc;background:var(--bg);font-family:Manrope,system-ui,sans-serif}.page{min-height:100svh;padding:0 18px;position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(circle at 51% 46%,#171421 0,#0a0911 40%,#06070d 100%)}.stars{position:absolute;inset:0;z-index:-2;opacity:.25;background-image:radial-gradient(#e5c27c .7px,transparent .8px);background-size:25px 25px}.container{width:min(1320px,100%);margin:auto}.top{height:99px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(234,194,110,.13)}.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}.brand img{width:39px;height:39px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(224,165,72,.6))}.brand b{display:block;font:700 1.1rem/1 Cinzel,serif;letter-spacing:.17em}.brand small{display:block;margin-top:6px;color:var(--gold);font:500 .58rem/1 'DM Mono',monospace;letter-spacing:.22em}.status{border:1px solid var(--line);border-radius:30px;padding:10px 14px;color:#cdb174;font:500 .6rem/1 'DM Mono',monospace;letter-spacing:.07em}.dot{display:inline-block;width:6px;height:6px;margin-right:7px;background:#e3a624;border-radius:50%;box-shadow:0 0 9px #e3a624}.auth-shell{display:grid;grid-template-columns:1fr 1fr;width:min(1084px,100%);min-height:690px;margin:100px auto 76px;border:1px solid rgba(233,190,102,.22);border-radius:13px;overflow:hidden;background:rgba(10,10,17,.72);box-shadow:0 28px 90px rgba(0,0,0,.48)}.scene{position:relative;min-height:400px;overflow:hidden;border-right:1px solid rgba(233,190,102,.19);background:#10101a}.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.54) saturate(.64);transform:scale(1.03)}.scene::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,5,10,.93),rgba(7,8,15,.04) 58%),linear-gradient(90deg,rgba(4,5,11,.37),transparent)}.scene-quote{position:absolute;z-index:1;left:32px;right:32px;bottom:33px;padding:20px 24px;border:1px solid var(--line);border-radius:7px;background:rgba(5,6,12,.62);box-shadow:0 8px 25px rgba(0,0,0,.35)}.scene-quote q{display:block;color:#f6e2ad;font:600 1.22rem/1.15 'Cormorant Garamond',serif;font-style:italic;letter-spacing:.04em}.scene-quote span{display:block;margin-top:12px;color:var(--gold);font:500 .57rem/1 'DM Mono',monospace;letter-spacing:.17em}.panel{display:flex;align-items:center;justify-content:center;padding:42px clamp(27px,5vw,50px);background:linear-gradient(140deg,rgba(21,21,31,.97),rgba(8,9,15,.97))}.form-wrap{width:min(100%,440px)}.rune{color:var(--gold);text-align:center;font:500 .8rem/1 'DM Mono',monospace;letter-spacing:.2em}.form-wrap h1{margin:12px 0 5px;text-align:center;font:600 clamp(1.7rem,3vw,2.2rem)/1.2 Cinzel,serif;letter-spacing:.09em}.subtitle{margin:0 0 32px;color:#9998a7;text-align:center;font-size:.78rem;letter-spacing:.07em}.tabs{display:grid;grid-template-columns:1fr 1fr;margin-bottom:29px;border:1px solid rgba(219,165,68,.28);border-radius:8px;padding:3px;background:#07070c}.tab{border:0;border-radius:5px;background:transparent;color:#888597;cursor:pointer;padding:12px 8px;font:600 .69rem/1 Cinzel,serif;letter-spacing:.05em}.tab.active{background:linear-gradient(90deg,#30170c,#42200c);color:#ffe5a3;box-shadow:inset 0 0 0 1px rgba(226,155,45,.46)}.field{display:block;margin:0 0 18px}.field label{display:flex;justify-content:space-between;margin-bottom:8px;color:#d6b46d;font:500 .62rem/1 'DM Mono',monospace;letter-spacing:.15em}.field label em{color:#9c7d42;font-style:normal;letter-spacing:0}.field input{width:100%;height:48px;border:1px solid rgba(218,163,63,.3);border-radius:6px;padding:0 14px;background:#08090f;color:#f6ead0;font:500 .9rem/1 Manrope,sans-serif;outline:none;transition:border .2s,box-shadow .2s}.field input::placeholder{color:#666475}.field input:focus{border-color:#d89f45;box-shadow:0 0 0 3px rgba(218,163,63,.1)}.password{position:relative}.password input{padding-right:50px}.eye{position:absolute;right:0;bottom:0;width:48px;height:48px;border:0;background:transparent;color:#97885f;cursor:pointer;font-size:1rem}.hidden{display:none!important}.remember{display:flex;align-items:center;gap:9px;margin:0 0 24px;color:#aaa7b1;font-size:.74rem;cursor:pointer}.remember input{accent-color:#d99e3c}.submit{display:flex;width:100%;min-height:52px;align-items:center;justify-content:center;gap:10px;border:1px solid #e7a745;border-radius:6px;color:#fff1c9;cursor:pointer;background:linear-gradient(96deg,#7c1f1b,#9c311f 54%,#6b1717);box-shadow:0 7px 21px rgba(133,39,21,.28),inset 0 1px rgba(255,240,180,.34);font:600 .8rem/1 Cinzel,serif;letter-spacing:.1em;transition:transform .18s,filter .18s}.submit:hover{transform:translateY(-2px);filter:brightness(1.12)}.submit:disabled{cursor:wait;opacity:.65}.text-error{margin:14px 0 0;color:#ffaba2;text-align:center;font-size:.77rem;line-height:1.45}.register-link{margin:27px 0 0;color:#9996a2;text-align:center;font-size:.75rem}.register-link button{border:0;border-bottom:1px solid #d8a13f;padding:0 0 2px;color:#f3c961;background:transparent;cursor:pointer;font:600 .72rem/1 Cinzel,serif;letter-spacing:.04em}.secure{margin-top:24px;padding-top:16px;border-top:1px solid rgba(229,194,129,.15);color:#777583;text-align:center;font:500 .55rem/1.4 'DM Mono',monospace;letter-spacing:.08em}@media(max-width:760px){.page{padding:0 13px}.top{height:76px}.brand img{width:33px;height:33px}.brand b{font-size:.89rem}.brand small{font-size:.47rem}.status{font-size:.49rem;padding:8px}.auth-shell{display:block;min-height:0;margin:30px auto 40px}.scene{min-height:240px;border-right:0;border-bottom:1px solid rgba(233,190,102,.19)}.scene-quote{left:18px;right:18px;bottom:18px;padding:15px 17px}.scene-quote q{font-size:1.05rem}.panel{padding:36px 22px}.form-wrap h1{font-size:1.55rem}.subtitle{margin-bottom:25px}.status span:last-child{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <div class="page"><div class="stars"></div><div class="container">
    <header class="top"><a class="brand" href="index.html"><img src="logo.png" alt=""><span><b>ABHYUDAYA</b><small>THE ASHEN CODES</small></span></a><div class="status"><span class="dot"></span><span>SANCTUARY LINK SECURE</span></div></header>
    <main class="auth-shell">
      <aside class="scene" aria-label="Abhyudaya sanctuary artwork"><img src="hero.png" alt="An illuminated sanctuary in the Abhyudaya realm"><div class="scene-quote"><q>Small steps. Light great fires.</q><span>THE SURYA ARCHIVES&nbsp;&nbsp; / /  अभ्युदय</span></div></aside>
      <section class="panel" aria-labelledby="auth-welcome-title"><div class="form-wrap">
        <div class="rune">✦ &nbsp;ॐ&nbsp; ✦</div><h1 id="auth-welcome-title">ENTER SANCTUARY</h1><p class="subtitle">REKINDLE YOUR SACRED DISCIPLINE</p>
        <div class="tabs" role="tablist" aria-label="Authentication mode"><button class="tab active" id="tab-signin" type="button" role="tab" aria-selected="true" onclick="switchProtocol('signin')">SIGN IN</button><button class="tab" id="tab-signup" type="button" role="tab" aria-selected="false" onclick="switchProtocol('signup')">CREATE CHAMPION</button></div>
        <form novalidate>
          <label class="field hidden" id="field-handle"><span><label for="input-name">CHAMPION NAME <em>YOUR IDENTITY</em></label><input id="input-name" type="text" autocomplete="nickname" placeholder="Your chosen name" disabled></span></label>
          <label class="field"><span><label for="input-email">SEEKER ID / EMAIL <em>REQUIRED</em></label><input id="input-email" type="email" autocomplete="email" placeholder="you@example.com" required></span></label>
          <div class="field"><label for="input-password">SECRET MANTRA / PASSWORD <em id="forgot-link">At least 8 characters</em></label><div class="password"><input id="input-password" type="password" autocomplete="current-password" placeholder="Enter your password" required minlength="8"><button class="eye" type="button" onclick="togglePassVisibility()" aria-label="Show password" id="pass-icon">◉</button></div></div>
          <label class="field hidden" id="field-confirm"><span><label for="input-confirm">CONFIRM PASSWORD</label><input id="input-confirm" type="password" autocomplete="new-password" placeholder="Repeat your password" disabled></span></label>
          <label class="remember"><input type="checkbox" checked> Keep presence remembered</label>
          <button class="submit" type="submit"><span id="cta-label">SIGN IN TO SANCTUARY</span><span>→</span></button>
        </form>
        <p class="register-link" id="register-copy">New to the realm? <button type="button" onclick="switchProtocol('signup')">CREATE YOUR CHAMPION →</button></p><p class="secure">YOUR ACCOUNT, QUESTS, AND REWARDS ARE PRIVATE TO YOUR REALM.</p>
      </div></section>
    </main>
  </div></div>
  <script>
    function switchProtocol(mode) {
      const signup = mode === 'signup';
      const signIn = document.getElementById('tab-signin'), signUp = document.getElementById('tab-signup');
      const handle = document.getElementById('field-handle'), confirm = document.getElementById('field-confirm');
      signIn.classList.toggle('active', !signup); signUp.classList.toggle('active', signup);
      signIn.setAttribute('aria-selected', String(!signup)); signUp.setAttribute('aria-selected', String(signup));
      handle.classList.toggle('hidden', !signup); confirm.classList.toggle('hidden', !signup);
      handle.querySelector('input').disabled = !signup; confirm.querySelector('input').disabled = !signup;
      handle.querySelector('input').required = signup; confirm.querySelector('input').required = signup;
      document.getElementById('auth-welcome-title').textContent = signup ? 'CREATE CHAMPION' : 'ENTER SANCTUARY';
      document.querySelector('.subtitle').textContent = signup ? 'BEGIN YOUR HEROIC JOURNEY' : 'REKINDLE YOUR SACRED DISCIPLINE';
      document.getElementById('cta-label').textContent = signup ? 'CREATE MY CHAMPION' : 'SIGN IN TO SANCTUARY';
      document.getElementById('register-copy').classList.toggle('hidden', signup);
      document.getElementById('input-password').autocomplete = signup ? 'new-password' : 'current-password';
    }
    function togglePassVisibility() { const field=document.getElementById('input-password'), button=document.getElementById('pass-icon'); const show=field.type==='password'; field.type=show?'text':'password'; button.textContent=show?'◌':'◉'; button.setAttribute('aria-label',show?'Hide password':'Show password'); }
  </script>
  <script src="site.js"></script><script src="auth-client.js"></script>
</body>
</html>
