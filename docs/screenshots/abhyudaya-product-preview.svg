<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Abhyudaya Life RPG product preview</title><desc id="desc">A dark neon dashboard showing quest rewards, character progression and streak momentum.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#060e20"/><stop offset="1" stop-color="#1c1536"/></linearGradient><linearGradient id="gold" x2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#ffddb8"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1440" height="810" fill="url(#bg)"/><circle cx="1100" cy="140" r="180" fill="#571bc1" opacity=".18" filter="url(#glow)"/><circle cx="530" cy="730" r="190" fill="#29c1df" opacity=".12" filter="url(#glow)"/>
  <rect x="32" y="28" width="245" height="754" rx="22" fill="#0b1326" stroke="#2d3449"/><circle cx="75" cy="79" r="25" fill="url(#gold)"/><text x="112" y="74" fill="#ffc174" font-family="Arial,sans-serif" font-size="25" font-weight="700">ABHYUDAYA</text><text x="112" y="98" fill="#54ddfc" font-family="Arial,sans-serif" font-size="12" letter-spacing="3">HERO REALM</text>
  <g font-family="Arial,sans-serif" font-size="16" fill="#d8c3ad"><text x="62" y="170" fill="#ffc174" font-weight="700">▦  Dashboard</text><text x="62" y="220">⚔  Quests</text><text x="62" y="270">◈  Character</text><text x="62" y="320">▣  Inventory</text><text x="62" y="370">◉  Guild Shop</text><text x="62" y="420">✦  Trophy Room</text><text x="62" y="470">↗  Progression</text><text x="62" y="520">⚙  System Settings</text></g>
  <text x="325" y="84" fill="#dae2fd" font-family="Arial,sans-serif" font-size="34" font-weight="700">Command Centre</text><text x="325" y="112" fill="#d8c3ad" font-family="Arial,sans-serif" font-size="16">Turn real-world actions into a character you can see grow.</text>
  <g><rect x="325" y="145" width="1050" height="112" rx="18" fill="#131b2e" stroke="#2d3449"/><text x="354" y="180" fill="#54ddfc" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">LEVEL 3 • TECHNOMANCER</text><text x="354" y="220" fill="#dae2fd" font-family="Arial,sans-serif" font-size="23" font-weight="700">Your next ascension is within reach.</text><rect x="856" y="177" width="245" height="14" rx="7" fill="#2d3449"/><rect x="856" y="177" width="152" height="14" rx="7" fill="#54ddfc"/><text x="856" y="220" fill="#d8c3ad" font-family="Arial,sans-serif" font-size="14">380 / 900 XP</text><text x="1180" y="181" fill="#ffc174" font-family="Arial,sans-serif" font-size="17" font-weight="700">✦ 125 Gold</text><text x="1180" y="220" fill="#ffb4ab" font-family="Arial,sans-serif" font-size="17" font-weight="700">🔥 3-day streak</text></g>
  <g font-family="Arial,sans-serif"><text x="325" y="313" fill="#dae2fd" font-size="24" font-weight="700">Today’s Quest Log</text><text x="325" y="340" fill="#d8c3ad" font-size="14">Every completion is verified by the server and rewards your real profile.</text>
    <rect x="325" y="370" width="650" height="125" rx="18" fill="#171f33" stroke="#534434"/><text x="353" y="407" fill="#54ddfc" font-size="13" font-weight="700">INTELLECT OPERATION</text><text x="353" y="440" fill="#dae2fd" font-size="22" font-weight="700">Complete System Design Chapter 4</text><text x="353" y="470" fill="#ffc174" font-size="15">+100 XP  •  +25 Gold  •  +1 INT</text><rect x="785" y="420" width="160" height="45" rx="11" fill="url(#gold)"/><text x="812" y="449" fill="#472a00" font-size="15" font-weight="700">COMPLETE</text>
    <rect x="325" y="520" width="650" height="125" rx="18" fill="#171f33" stroke="#534434"/><text x="353" y="557" fill="#ffc174" font-size="13" font-weight="700">STRENGTH OPERATION</text><text x="353" y="590" fill="#dae2fd" font-size="22" font-weight="700">Morning Mobility &amp; 5km Run</text><text x="353" y="620" fill="#ffc174" font-size="15">+100 XP  •  +25 Gold  •  +1 STR</text><rect x="785" y="570" width="160" height="45" rx="11" fill="url(#gold)"/><text x="812" y="599" fill="#472a00" font-size="15" font-weight="700">COMPLETE</text>
  </g>
  <g font-family="Arial,sans-serif"><rect x="1010" y="370" width="365" height="275" rx="18" fill="#131b2e" stroke="#2d3449"/><text x="1040" y="410" fill="#dae2fd" font-size="22" font-weight="700">Momentum Forge</text><text x="1040" y="440" fill="#d8c3ad" font-size="14">Build your chain one real day at a time.</text><text x="1040" y="520" fill="#ffb95f" font-size="64" font-weight="700">3</text><text x="1110" y="500" fill="#dae2fd" font-size="24" font-weight="700">DAY</text><text x="1110" y="530" fill="#d8c3ad" font-size="15">STREAK</text><g fill="#f59e0b"><circle cx="1045" cy="581" r="15"/><circle cx="1090" cy="581" r="15"/><circle cx="1135" cy="581" r="15"/></g><g fill="#2d3449"><circle cx="1180" cy="581" r="15"/><circle cx="1225" cy="581" r="15"/><circle cx="1270" cy="581" r="15"/><circle cx="1315" cy="581" r="15"/></g></g>
  <text x="325" y="730" fill="#54ddfc" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">LIFE, LEVELLED UP.</text><text x="325" y="756" fill="#d8c3ad" font-family="Arial,sans-serif" font-size="15">Secure accounts • Supabase Postgres • Vercel deployment</text>
